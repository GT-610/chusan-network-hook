name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build DLLs and smoke tests
        shell: cmd
        run: build.bat

      # The same script probes.yml runs, so a tag and a pull request are gated by one list.
      - name: Run smoke tests and probes
        shell: pwsh
        run: ./tests/run-probes.ps1

      - name: Assemble release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build\chusan_network_hook_x64.dll release\
          Copy-Item build\chusan_network_hook_x86.dll release\
          Copy-Item network_hook.ini release\
          Compress-Archive -Path release\* -DestinationPath "build\chusan-network-hook_${{ github.ref_name }}.zip" -Force

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { throw "Release tags must start with v." }
          gh release create $tag `
            "build\chusan-network-hook_${tag}.zip" `
            --title $tag `
            --generate-notes
