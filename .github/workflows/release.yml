name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build DLLs and smoke tests
        shell: cmd
        run: build.bat

      - name: Run smoke tests
        shell: pwsh
        run: |
          .\build\network_hook_smoketest_x64.exe .\build\chusan_network_hook_x64.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\network_hook_smoketest_x86.exe .\build\chusan_network_hook_x86.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build\chusan_network_hook_x64.dll release\
          Copy-Item build\chusan_network_hook_x86.dll release\
          Copy-Item build\network_hook_smoketest_x64.exe release\
          Copy-Item build\network_hook_smoketest_x86.exe release\
          Copy-Item network_hook.ini release\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath "build\chusan-network-hook_${{ github.ref_name }}.zip" -Force

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "build\chusan-network-hook_${{ github.ref_name }}.zip" `
            "build\chusan_network_hook_x64.dll" `
            "build\chusan_network_hook_x86.dll" `
            --generate-notes `
            --title "${{ github.ref_name }}"
