name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build DLLs and smoke tests
        shell: cmd
        run: build.bat

      - name: Run smoke tests
        shell: pwsh
        run: |
          .\build\network_hook_smoketest_x64.exe .\build\chusan_network_hook_x64.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\network_hook_smoketest_x86.exe .\build\chusan_network_hook_x86.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Broadcast interface forcing only engages against a real local address, so re-run
      # with one to keep that path covered in CI. A second run with an address no real
      # interface owns covers the strict-mode refusal path. The configured address is
      # written over the packed ini because build.bat copies the repository one in.
      - name: Run interface forcing test
        shell: pwsh
        run: |
          $address = (Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object { $_.IPAddress -ne '127.0.0.1' -and $_.PrefixLength -lt 32 } |
            Select-Object -First 1).IPAddress
          if (-not $address) { throw 'No local IPv4 address available for the interface forcing test.' }
          Write-Host "Using $address"

          function Set-TestInterface([string]$configured) {
            Set-Content build\network_hook.ini -Encoding ascii -Value @"
          [network]
          enable=1
          interfaceAddress=$configured
          forceLimitedBroadcast=1
          forceTcpSource=1
          strict=1

          [lanInstall]
          enable=1

          [log]
          enable=0
          detailed=0
          writeFile=0
          "@
          }

          Set-TestInterface $address
          .\build\network_hook_smoketest_x64.exe .\build\chusan_network_hook_x64.dll $address
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\network_hook_smoketest_x86.exe .\build\chusan_network_hook_x86.dll $address
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # 203.0.113.0/24 is reserved for documentation, so no real interface owns it.
          Set-TestInterface '203.0.113.7'
          .\build\network_hook_smoketest_x64.exe .\build\chusan_network_hook_x64.dll 203.0.113.7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\network_hook_smoketest_x86.exe .\build\chusan_network_hook_x86.dll 203.0.113.7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build\chusan_network_hook_x64.dll release\
          Copy-Item build\chusan_network_hook_x86.dll release\
          Copy-Item network_hook.ini release\
          Compress-Archive -Path release\* -DestinationPath "build\chusan-network-hook_${{ github.ref_name }}.zip" -Force

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { throw "Release tags must start with v." }
          gh release create $tag `
            "build\chusan-network-hook_${tag}.zip" `
            --title $tag `
            --generate-notes
