name: Build artifact

# Manual build of an arbitrary ref. Uploads an artifact only; never creates a
# release and never writes to the repository. Used to produce a CI-built DLL for
# a branch so it can be compared against another CI-built DLL from the same
# runner image.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch, tag or commit to build'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      archive: ${{ steps.meta.outputs.archive }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch }}

      # github.sha on workflow_dispatch is the sha of the ref the workflow file
      # was picked from, not the ref we just checked out, so read it back from
      # the checkout instead. The archive name also has to be sanitized: a
      # branch name may contain '/', which is not allowed in an artifact name.
      - name: Record resolved ref
        id: meta
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $safe = ($sha.Substring(0, 7) + '_' + ('${{ inputs.branch }}' -replace '[^A-Za-z0-9._-]', '_'))
          "sha=$sha"          >> $env:GITHUB_OUTPUT
          "safe=$safe"        >> $env:GITHUB_OUTPUT
          "archive=build\chusan-network-hook_$safe.zip" >> $env:GITHUB_OUTPUT
          "branch input : ${{ inputs.branch }}"
          "resolved sha : $sha"

      - name: Report toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $root = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            "vs root : $root"
            $devcmd = Join-Path $root 'Common7\Tools\VsDevCmd.bat'
            cmd /c "`"$devcmd`" -arch=x64 -host_arch=x64 >nul && cl 2>&1"
          } else {
            "vswhere : not found"
          }

      - name: Build DLLs and smoke tests
        shell: cmd
        run: build.bat

      - name: Run smoke tests
        shell: pwsh
        run: |
          .\build\network_hook_smoketest_x64.exe .\build\chusan_network_hook_x64.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\network_hook_smoketest_x86.exe .\build\chusan_network_hook_x86.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble artifact archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build\chusan_network_hook_x64.dll artifact\
          Copy-Item build\chusan_network_hook_x86.dll artifact\
          Copy-Item network_hook.ini artifact\
          Compress-Archive -Path artifact\* -DestinationPath "${{ steps.meta.outputs.archive }}" -Force

      - name: Record binary hashes
        shell: pwsh
        run: |
          Get-FileHash build\chusan_network_hook_x64.dll -Algorithm SHA256 |
            ForEach-Object { "x64 sha256 : $($_.Hash)  $((Get-Item $_.Path).Length)" }
          Get-FileHash build\chusan_network_hook_x86.dll -Algorithm SHA256 |
            ForEach-Object { "x86 sha256 : $($_.Hash)  $((Get-Item $_.Path).Length)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chusan-network-hook-${{ steps.meta.outputs.safe }}
          path: ${{ steps.meta.outputs.archive }}
          if-no-files-found: error