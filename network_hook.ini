[network]
; 1 = choose a network interface, pin the game's LAN traffic to it, and present it to
; the game the way segatools' netenv used to.
enable=1

; Which interface carries the LAN. Accepts an IPv4 address, an adapter friendly name,
; or a numeric interface index. Empty = decide automatically:
;   1. the only acceptable adapter inside [keychip] subnet from segatools.ini;
;   2. the only acceptable adapter with a routable IPv4.
; Nothing is chosen when segatools.ini has [netenv] enable=1: segatools owns the network
; then, and this hook neither presents an adapter nor pins traffic.
; "Acceptable" means the link types the game can use: Ethernet, or wireless (rewritten
; to Ethernet). TAP/Tailscale/VPN adapters report a link type the game rejects anyway,
; so they are not counted.
;
; A named adapter that does not match is a hard error, never a silent fall-through to
; the automatic order above. A non-ASCII name ("以太网实例 0 3") requires this file to be
; saved as UTF-16; the Windows profile API reads an ANSI file as the system code page.
; The numeric index always works and needs no encoding.
interface=

; 1 = present only the chosen adapter, so a lower-index adapter cannot win by accident.
exclusive=1

; 1 = also accept loopback as a LAN adapter. Off by default: chusanApp rejects loopback
; (IfType 24), and enabling this makes the game treat 127.0.0.1 as a LAN peer.
allowLoopback=0

; Pin broadcast traffic to the chosen interface. The game addresses the directed subnet
; broadcast (a.b.c.255), not 255.255.255.255; both are covered by the two switches.
forceDirectedBroadcast=1
forceLimitedBroadcast=1

; Answer every ICMP echo as a success, the way segatools' netenv did. Two network-test
; items depend on this: GATEWAY, which echoes the presented gateway, and NUMBER OF HOP,
; whose traceroute targets the ALL.Net authentication server. NUMBER OF HOP then reads 1
; -- the traceroute finishes on its first TTL=1 probe -- which is what it has always read
; under netenv. That number is not a measurement of the real path, and the game only
; compares it against zero.
;
; Set to 0 only if the real ICMP path is known to work. Without it, GATEWAY fails on a
; segment with no router, and NUMBER OF HOP can stay at CHECKING, which stops the
; network test and with it the game start.
virtualizeIcmp=1

; Point GetBestRoute at the presented interface. amdaemon resolves egress through it
; (FUN_1403bbbc0), as netenv did. This is a query only: real packet egress is decided by
; the routing table, so the game server keeps its own path.
overrideBestRoute=1

; Bind outgoing TCP to the chosen adapter's address.
forceTcpSource=1

; 1 = block the operation when the configured interface is wrong, instead of letting
; Windows fall back to its own routing.
strict=1

[lanInstall]
; Virtualise LAN Install (UDP 40112, TCP 40110) so it never reaches the network.
enable=1

[segatools]
; Path to segatools.ini. Empty = look beside this DLL, then one directory up.
path=

[log]
enable=1
detailed=0
writeFile=0
