[network]
; 1 = choose a network interface, pin the game's LAN traffic to it, and present it to
; the game the way segatools' netenv used to.
enable=1

; Which interface carries the LAN. Accepts an IPv4 address, an adapter friendly name,
; or a numeric interface index. Empty = decide automatically:
;   1. [keychip] subnet + [netenv] addrSuffix from segatools.ini, if a real adapter
;      owns that address (the common case, and what makes the stock file work);
;   2. the only acceptable adapter inside [keychip] subnet;
;   3. the only acceptable adapter with a routable IPv4.
; "Acceptable" means the link types the game can use: Ethernet, or wireless (rewritten
; to Ethernet). TAP/Tailscale/VPN adapters report a link type the game rejects anyway,
; so they are not counted.
interface=

; auto   = the order above
; native = never synthesise an adapter; fail if nothing real qualifies
; compat = reproduce netenv's synthetic adapter when nothing real qualifies
mode=auto

; 1 = present only the chosen adapter, so a lower-index adapter cannot win by accident.
exclusive=1

; 1 = also accept loopback as a LAN adapter. Off by default: chusanApp rejects loopback
; (IfType 24), and enabling this makes the game treat 127.0.0.1 as a LAN peer.
allowLoopback=0

; Pin broadcast traffic to the chosen interface. The game addresses the directed subnet
; broadcast (a.b.c.255), not 255.255.255.255; both are covered by the two switches.
forceDirectedBroadcast=1
forceLimitedBroadcast=1

; Answer ICMP echoes to addresses inside the presented subnet as successes, the way
; segatools' netenv answered all of them. amdaemon measures the gateway with an ICMP
; echo, so on a segment with no router -- ZeroTier and other flat L2 networks -- the
; gateway check fails without this even though the LAN itself is fine. Echoes to
; destinations outside the subnet are passed through, so real failures still show.
virtualizeIcmp=1

; Bind outgoing TCP to the chosen adapter''s address.
forceTcpSource=1

; 1 = block the operation when the configured interface is wrong, instead of letting
; Windows fall back to its own routing.
strict=1

[lanInstall]
; Virtualise LAN Install (UDP 40112, TCP 40110) so it never reaches the network.
enable=1

[segatools]
; Path to segatools.ini. Empty = look beside this DLL, then one directory up.
path=

[log]
enable=1
detailed=0
writeFile=0
